<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DolphinStream — Out-of-Core GameCube & Wii Web Player</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060911;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f8fafc;
        }
        #container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        #viewport-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
        }
        canvas#emulator-canvas {
            aspect-ratio: 4 / 3;
            max-width: 100%;
            max-height: 100%;
            background: #000;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }
        canvas#hud-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #controls-bar {
            height: 48px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            font-size: 0.85rem;
        }
        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 9999px;
            background: #1e293b;
            color: #94a3b8;
        }
        .badge.ok { background: #065f46; color: #34d399; }
        .badge.warn { background: #854d0e; color: #fde047; }
        button {
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div id="container">
        <div id="viewport-wrapper">
            <canvas id="emulator-canvas" width="640" height="480"></canvas>
            <canvas id="hud-canvas"></canvas>
        </div>
        <div id="controls-bar">
            <div style="display: flex; gap: 8px; align-items: center;">
                <span style="font-weight: 700; color: #38bdf8;">DolphinStream</span>
                <span id="badge-iso" class="badge">Checking...</span>
                <span id="badge-controller" class="badge">No Gamepad</span>
                <span id="badge-stream" class="badge ok">64 MB RAM Pool</span>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button id="btn-toggle-hud">Toggle Memory HUD</button>
                <button id="btn-fullscreen">Fullscreen</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createHudOverlay } from './hud_overlay.mjs';

        const emuCanvas = document.getElementById('emulator-canvas');
        const hudCanvas = document.getElementById('hud-canvas');
        const badgeIso = document.getElementById('badge-iso');
        const badgeController = document.getElementById('badge-controller');
        const badgeStream = document.getElementById('badge-stream');
        const btnToggleHud = document.getElementById('btn-toggle-hud');
        const btnFullscreen = document.getElementById('btn-fullscreen');

        // Verify COOP/COEP isolation for SharedArrayBuffer
        if (crossOriginIsolated) {
            badgeIso.textContent = "COOP/COEP ISOLATED";
            badgeIso.className = "badge ok";
        } else {
            badgeIso.textContent = "NOT ISOLATED";
            badgeIso.className = "badge warn";
        }

        // Wire HUD overlay
        const hud = createHudOverlay(hudCanvas);
        let latestHudSnapshot = null;
        let opfsMode = 'stream-only';
        let showHud = true;

        // Resize HUD canvas overlay
        function resize() {
            hudCanvas.width = window.innerWidth;
            hudCanvas.height = window.innerHeight;
            if (hud && latestHudSnapshot && showHud) {
                hud.render(latestHudSnapshot, { storageMode: opfsMode, gpuStatus: 'Active' });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Gamepad API input listener
        window.addEventListener('gamepadconnected', (e) => {
            badgeController.textContent = `Gamepad: ${e.gamepad.id.slice(0, 20)}...`;
            badgeController.className = "badge ok";
        });
        window.addEventListener('gamepaddisconnected', () => {
            badgeController.textContent = "No Gamepad";
            badgeController.className = "badge";
        });

        btnFullscreen.onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        };

        btnToggleHud.onclick = () => {
            showHud = !showHud;
            hudCanvas.style.display = showHud ? 'block' : 'none';
            if (showHud && latestHudSnapshot) {
                hud.render(latestHudSnapshot, { storageMode: opfsMode, gpuStatus: 'Active' });
            }
        };

        // Launch out-of-core streaming workers
        const channel = new MessageChannel();
        const workerA = new Worker('worker_a.js', { type: 'module' });
        const workerB = new Worker('worker_b.js', { type: 'module' });

        workerA.postMessage({ type: 'PORT', port: channel.port1 }, [channel.port1]);
        workerB.postMessage({ type: 'PORT', port: channel.port2 }, [channel.port2]);

        workerB.onmessage = (e) => {
            const { type, snapshot, opfsMode: mode, effectivePoolMB, reason } = e.data || {};
            if (type === 'HUD_SNAPSHOT') {
                latestHudSnapshot = snapshot || e.data;
                if (hud && showHud) {
                    hud.render(latestHudSnapshot, {
                        storageMode: opfsMode,
                        gpuStatus: 'Active'
                    });
                }
            } else if (type === 'STATUS') {
                if (mode) opfsMode = mode;
                if (badgeStream && effectivePoolMB) {
                    badgeStream.textContent = `${effectivePoolMB} MB RAM Pool (${opfsMode})`;
                }
                workerB.postMessage({ type: 'ENABLE_HUD', enabled: true });
            } else if (type === 'FATAL') {
                console.error("Worker B fatal error:", reason);
                if (badgeIso) {
                    badgeIso.textContent = reason;
                    badgeIso.className = "badge warn";
                }
            }
        };

        // Telemetry flush on tab close/hidden
        const flushTelem = (r) => workerB.postMessage({ type: 'FLUSH_TELEMETRY', reason: r });
        document.addEventListener('visibilitychange', () => flushTelem('pagehide'));
        window.addEventListener('pagehide', () => flushTelem('pagehide'));

        console.log("DolphinStream web shell initialized.");
    </script>
</body>
</html>
